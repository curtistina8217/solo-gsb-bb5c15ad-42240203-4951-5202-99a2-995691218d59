services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CALIB_DB_PATH: /data/calibration.db
      # 回执密钥环：JSON 对象（key_id -> 密钥）与当前签发键。
      # 两者都留空（默认）时回退到旧版单密钥 CORRECTION_RECEIPT_SECRET，
      # 保持 `docker compose up` 一键启动；配置了 KEYS 则必须同时提供
      # ACTIVE_KEY，且它必须是键环中的 key_id，否则容器拒绝启动。
      # 轮换示例（新旧键并存、切换签发键，旧回执仍可验证）：
      #   CORRECTION_RECEIPT_KEYS='{"2026-03":"<old-secret>","2026-09":"<new-secret>"}' \
      #   CORRECTION_RECEIPT_ACTIVE_KEY=2026-09 docker compose up -d
      CORRECTION_RECEIPT_KEYS: ${CORRECTION_RECEIPT_KEYS:-}
      CORRECTION_RECEIPT_ACTIVE_KEY: ${CORRECTION_RECEIPT_ACTIVE_KEY:-}
      # 旧版单密钥：仅在未配置 CORRECTION_RECEIPT_KEYS 时生效；
      # 生产部署必须通过同名环境变量覆盖，例如：
      #   CORRECTION_RECEIPT_SECRET=$(openssl rand -hex 32) docker compose up -d
      CORRECTION_RECEIPT_SECRET: ${CORRECTION_RECEIPT_SECRET:-dev-only-insecure-correction-receipt-secret}
    volumes:
      - calibration-data:/data
    restart: unless-stopped

volumes:
  calibration-data:
